name: Repository packaging checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      # Official tag commit SHAs verified with GitHub's git/ref/tags API.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Synthetic stdlib regression tests
        run: python -m unittest discover -s tests -v
      - name: Repository packaging (not scientific validity)
        run: python scripts/validate_repository.py
      - name: Empty documentary ledger template
        run: python econ-project-workflow/scripts/validate_learning_ledger.py econ-project-workflow/templates/learning-ledger.json
