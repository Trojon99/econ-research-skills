interface:
  display_name: Empirical Descriptive Analysis
  short_description: Empirical-economics descriptive analysis with a graph-first workflow.
    Use when ChatGPT is asked to plan, code, review, or interpret descriptive statistics,
    trends, subgroup comparisons, sample composition, seasonality, baseline characteristics,
    raw DID/DDD cells, or pre-regression diagnostics for microdata or panel data,
    especially in Stata projects. Prefer informative figures over tables, preserve
    exact-value audit files when useful, and align every descriptive output with the
    research design rather than mechanically summarizing all variables.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
